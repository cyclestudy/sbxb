name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: "github.com/cyclestudy/*"
      GONOSUMDB: "*"
      GONOSUMCHECK: "*"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: freebsd
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          COMMIT=${GITHUB_SHA::8}
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          BINARY="sbxb-${GOOS}-${GOARCH}"
          if [ -n "$GOARM" ]; then BINARY="${BINARY}v${GOARM}"; fi
          BINARY="${BINARY}${EXT}"

          go build -tags "with_quic,with_utls" \
            -ldflags "-s -w -X github.com/cyclestudy/sbxb/cmd/sbxb.version=${VERSION} -X github.com/cyclestudy/sbxb/cmd/sbxb.commit=${COMMIT}" \
            -o "${BINARY}" .

          if [ "$GOOS" != "windows" ]; then
            tar -czf "${BINARY%.exe}.tar.gz" "${BINARY}" config.json.example
          else
            zip "${BINARY%.exe}.zip" "${BINARY}" config.json.example
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbxb-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: sbxb-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
